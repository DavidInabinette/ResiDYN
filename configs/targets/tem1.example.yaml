project:
  target_id: TEM1
  structure_instance_id: TEM1_1BTL_ASU
  output_dir: outputs/tem1
  random_seed: 20260724

structure:
  path: data/raw/tem1/1btl.cif
  format: mmcif
  # Verify the intended biological assembly before production. This parser
  # reads the coordinates present in the supplied file.
  assembly_id: deposited_asymmetric_unit
  biological_assembly_verified: false
  source_model_number: 1
  label_asym_id: A
  target_sequence: REPLACE_WITH_VERIFIED_DMS_WT_SEQUENCE
  dms_position_offset: 0
  contact_cutoff_angstrom: 8.0

dms:
  path: data/raw/tem1/proteingym_stiffler2015.csv
  assay_id: TEM1_STIFFLER_2015
  mutation_column: mutant
  score_column: DMS_score
  # Set true only if the supplied score uses lower = better.
  reverse_direction: false

dfi:
  spring_law: d6
  gamma: 100.0
  cutoff_angstrom: null
  direction_mode: fibonacci
  n_directions: 256
  absolute_tolerance: 1.0e-10
  relative_tolerance: 1.0e-12
  rotation_trials: 8
  rotation_min_spearman: 0.995
  rotation_max_quartile_change: 0.05
  require_qc_pass: true
  functional_target_positions: []

proteinmpnn:
  conditional_npz: data/external/tem1/proteinmpnn/conditional_probs_only.npz
  alphabet: ACDEFGHIKLMNPQRSTVWYX
  repository_commit: REPLACE_WITH_PINNED_COMMIT
  checkpoint: v_48_020
  backbone_noise: 0.0
  seed: 20260724
  # Record the exact upstream invocation; this package imports its NPZ.
  command: >-
    python protein_mpnn_run.py --pdb_path outputs/tem1/proteinmpnn_input.pdb
    --conditional_probs_only 1 --conditional_probs_only_backbone 0
    --path_to_model_weights REPLACE --model_name v_48_020
    --backbone_noise 0.0 --seed 20260724
  training_exposure:
    exact_structure_in_training: unknown
    sequence_cluster_30: unknown
    split: unknown
    closest_training_sequence_identity: null
    evidence: REPLACE_WITH_AUDIT_SOURCE

consurf:
  path: data/external/tem1/consurf.grades
  format: grades

features:
  # CSV keyed by target_position; should include sasa and
  # secondary_structure. Other residue-level covariates are allowed only if
  # prespecified.
  residue_covariates: data/external/tem1/structural_covariates.csv

validation:
  outer_folds: 5
  inner_folds: 4
  minimum_residues_per_fold: 5
  alphas: [0.01, 0.1, 1.0, 10.0, 100.0]
  bootstrap_replicates: 1000
  numeric_baseline:
    - mpnn_delta_logp
    - sasa
    - contact_number
    - consurf_score
    - coordinate_quality
    - gap_adjacent
  categorical_baseline:
    - secondary_structure
    - wt
    - mutant
  dynamics_feature: pct_dfi
